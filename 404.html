<!DOCTYPE html>
<html>

    <script type="text/javascript">

      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var redirect = l.pathname + l.search + l.hash;
      if (redirect.startsWith('/my-portfolio-website/')) {
        redirect = redirect.substring('/my-portfolio-website'.length);
      }
      window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/my-portfolio-website/?/' + redirect);
    </script>
  </head>
